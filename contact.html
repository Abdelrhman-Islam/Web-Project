<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تواصل معنا - صيدلية الشفاء</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
        <link
      rel="stylesheet"
      href="./style.css"
    />
    <style>
      :root {
        --primary: #0d9488;
        --bg: #f3f4f6;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: var(--bg);
      }
      .navbar {
        background: white;
        padding: 1rem 5%;
        text-align: center;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      .container {
        max-width: 900px;
        margin: 3rem auto;
        padding: 20px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 30px;
      }

      .contact-info {
        background: var(--primary);
        color: white;
        padding: 40px;
        border-radius: 15px;
      }
      .info-item {
        display: flex;
        gap: 15px;
        margin-bottom: 25px;
        align-items: center;
      }
      .info-item i {
        font-size: 1.5rem;
      }

      .contact-form {
        background: white;
        padding: 40px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group input,
      .input-group textarea {
        width: 100%;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
      }

      .btn-send {
        background: var(--primary);
        color: white;
        padding: 12px 30px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        width: 100%;
      }
      

      @media (max-width: 768px) {
        .container {
          grid-template-columns: 1fr;
        }
       
      }

    </style>
  </head>
  <body>
<nav class="navbar">
    <a href="landing.html" class="logo">
        <i class="fas fa-heartbeat"></i>
        صيدليتي
    </a>

    <div class="search-box">
        <input type="text" placeholder="ابحث عن دواء...">
        <i class="fas fa-search" style="color: #999;"></i>
    </div>

    <div class="nav-icons">
        <a href="profile.html">حسابي</a> 
        
        <a href="cart.html" class="cart-icon-link">
            <i class="fas fa-shopping-cart" style="color:var(--secondary-color); font-size:1.2rem;"></i>
            <span class="cart-badge" id="cartBadge">0</span>
        </a>
    </div>
</nav>

    <div class="container">
      <div class="contact-info">
        <h2 style="margin-bottom: 30px">معلومات التواصل</h2>
        <div class="info-item">
          <i class="fas fa-phone"></i>
          <div>
            <strong>الهاتف</strong>
            <div>19999</div>
          </div>
        </div>
        <div class="info-item">
          <i class="fas fa-envelope"></i>
          <div>
            <strong>البريد الإلكتروني</strong>
            <div>support@shefaa.com</div>
          </div>
        </div>
        <div class="info-item">
          <i class="fas fa-map-marker-alt"></i>
          <div>
            <strong>العنوان</strong>
            <div>القاهرة، مدينة نصر، شارع عباس العقاد</div>
          </div>
        </div>
      </div>

      <form class="contact-form">
        <h2 style="margin-bottom: 20px">أرسل لنا رسالة</h2>
        <div class="input-group"><input type="text" placeholder="الاسم" /></div>
        <div class="input-group">
          <input type="email" placeholder="البريد الإلكتروني" />
        </div>
        <div class="input-group">
          <textarea rows="4" placeholder="كيف يمكننا مساعدتك؟"></textarea>
        </div>
        <button class="btn-send">إرسال</button>
      </form>
    </div>
    <script src="main.js"></script>
  </body>
</html>
